<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Generator</title>
    <link rel="stylesheet" href="generateColors.css">
</head>
<body>
    <main class="card">
        <p class="eyebrow">Color Generator</p>

        <div class="swatch" id="swatch">
            <span class="hex" id="hex">#000000</span>
        </div>

        <button id="generateBtn">Generate color</button>

        <div class="history" id="history">
            <p class="history-label">Recent</p>
            <div class="chips" id="chips"></div>
        </div>
    </main>

    <script src="generateColors.js"></script>
</body>
</html>
